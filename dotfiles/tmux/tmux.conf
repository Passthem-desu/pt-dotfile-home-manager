## 基础设置

# 使用 <C-b> r 来自动重载配置文件
# （配置改由 home-manager 写到 XDG 路径，tmux 3.1+ 会自动读这里）
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# 用其他键位，而不是 <C-b> 作为前缀符号
# set -g prefix C-a
set -g prefix C-b

# 配置控制台配色，让控制台程序正常运行
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

# 配置 Tmux 转义时间，保证不会出现 ANSI garbage
set -s escape-time 1000

# 穿透鼠标操作
# 同时可以用鼠标调整各个面板的宽度
set -g mouse on

# 数字从 1 开始，不用按遥远的 0
set -g base-index 1

# 每次关闭一个窗口，自动重新调整它们的数字
set -g renumber-windows on

# 在关闭一个 tmux session 的时候，不要退出 tmux 应用
set -g detach-on-destroy off

set -g set-clipboard on
set -g status-position top
set -g default-terminal "${TERM}"

# 使用 vi 式的键位在窗口中游走
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# https://github.com/badlogic/pi-mono/blob/main/packages/coding-agent/docs/tmux.md
set -g extended-keys on
# set -g extended-keys-format csi-u

# 防止出现一些 NeoVim 的奇怪兼容问题
set -g allow-passthrough on
set -as terminal-features 'xterm*:nosixel'

## 插件
# 插件本体（sensible / vim-tmux-navigator / onedark-theme）由 home-manager
# 的 programs.tmux.plugins 注入 run-shell 行，不再使用 tpm。
# 下面只是 onedark-theme 自己的两个设置项。

set -g @onedark_time_format "%H:%M"
set -g @onedark_date_format "%Y年%m月%d日"
